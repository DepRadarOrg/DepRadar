name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build dashboard
        run: npm run build
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the public scan badge
        working-directory: .
        run: |
          set -euo pipefail
          cargo build --locked --bin depradar
          report=docs/repo-scan/published-report.json
          receipt=docs/repo-scan/published-receipt.json
          badge=frontend/dist/repo-scan.svg
          if [[ -f "$report" ]]; then
            target/debug/depradar repo-badge "$report" --public --receipt "$receipt" > "$badge"
          else
            # No report has cleared publication yet.
            target/debug/depradar repo-badge "$report" --public > "$badge"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
