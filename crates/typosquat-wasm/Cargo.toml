[package]
name = "typosquat-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The DepRadar typosquat scorer compiled to WebAssembly for the dashboard"

[lib]
crate-type = ["cdylib", "rlib"]
# The mounted `typosquat` module's own unit tests run in the root crate.
test = false
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"
