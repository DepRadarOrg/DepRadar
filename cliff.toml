# git-cliff configuration for DepRadar
# https://git-cliff.org/docs/configuration
#
# Usage:
#   git cliff -o CHANGELOG.md            # regenerate the full changelog
#   git cliff --unreleased --tag v1.0.0  # preview the next release section
#   git cliff --latest                   # print only the latest release section

[changelog]
# Header rendered at the top of the generated changelog.
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This changelog is generated from the git history with
[git-cliff](https://git-cliff.org) using
[Conventional Commits](https://www.conventionalcommits.org/).
"""
# Body template applied to each release section.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} **(BREAKING)**{% endif %}\
{% endfor %}
{% endfor %}\n
"""
# Footer rendered at the bottom of the generated changelog.
footer = """
<!-- generated by git-cliff -->
"""
# Strip leading/trailing whitespace from rendered sections.
trim = true

[git]
# Only include commits reachable from the current branch history.
conventional_commits = true
# Ignore commits that do not follow the Conventional Commits specification.
filter_unconventional = true
# Split commits on newlines so multi-line bodies are handled per line.
split_commits = false
# Parse merge commits as well.
filter_commits = false
# Use the first line of the commit message as the changelog entry.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
]
# Protect breaking changes from being skipped by the parsers above.
protect_breaking_commits = true
# Filter out commits that should not appear in the changelog.
filter_commits = false
# Sort commits within each group by oldest first.
sort_commits = "oldest"
# Match tags that look like semantic versions (v1.2.3).
tag_pattern = "v[0-9]*"
# Skip tags that do not match the pattern above.
skip_tags = ""
# Ignore tags that are not semver-like.
ignore_tags = ""
# Topo-order the commits for a stable changelog.
topo_order = false
# Use the commit date for release timestamps.
# (git-cliff defaults to the tag/commit timestamp.)
```

Note: I returned the file content only, as requested. The `cliff.toml` above configures git-cliff with a Keep-a-Changelog-style header, conventional-commit parsers grouped by type (feat/fix/perf/refactor/docs/test/ci/build/chore/style/revert plus a security body matcher), breaking-change protection, and `v*` tag matching so `git cliff -o CHANGELOG.md` produces a full-history changelog.