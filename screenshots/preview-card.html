<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview harness — DepRadar</title>
<style>
  body { margin: 0; background: #10151f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card {
    width: 640px; background: #fff; border-radius: 16px; overflow: hidden;

    padding: 14px 16px; border-top: 1px solid #e6e9ee;
  }
  .site { color: #8899a6; font-size: 13px; line-height: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .title { color: #0f1419; font-weight: 700; font-size: 15px; line-height: 1.35; margin-top: 4px; }
  .desc { color: #5b6b7b; font-size: 14px; line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
  <div class="card">
    <img src="og-image.png" alt="DepRadar OG card" width="640" height="336" style="display:block;width:100%;">
    <div class="meta">
      <div class="site">github.com/DepRadarOrg/DepRadar</div>
      <div class="title">DepRadar — Supply-Chain Security Bounties on Stellar</div>
      <div class="desc">Securing the open source supply chain, one bounty at a time. Typosquat + CVE bounties on Stellar testnet.</div>
    </div>
  </div>

</html>
